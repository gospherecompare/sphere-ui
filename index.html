<!doctype html>

<html lang="en-IN">
  <head>
    <!-- Basic -->
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f8fc" />

    <!-- MobileX Favicon -->
    <link rel="icon" href="/mobilex-favicon.svg" type="image/svg+xml" />

    <link
      rel="shortcut icon"
      href="/mobilex-favicon.svg"
      type="image/svg+xml"
    />

    <title>MobileX – Smartphones, Comparisons & Tech News</title>

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="MobileX" />
    <meta property="og:locale" content="en_IN" />

    <meta
      property="og:title"
      content="MobileX – Smartphones, Comparisons & Tech News"
    />

    <meta
      property="og:description"
      content="Compare smartphones with clear specifications, features and practical comparisons. Get the latest mobile news, launches and buying insights from MobileX."
    />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />

    <meta
      name="twitter:title"
      content="MobileX – Smartphones, Comparisons & Tech News"
    />

    <meta
      name="twitter:description"
      content="Compare smartphones with clear specifications, features and practical comparisons. Get the latest mobile news, launches and buying insights from MobileX."
    />

    <!-- Meta Description -->
    <meta
      name="description"
      content="Compare smartphones with clear specifications, features and practical comparisons. Get the latest mobile news, launches and buying insights from MobileX."
    />

    <!-- Organization Schema -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "MobileX",
        "url": "https://mobilesx.in/",
        "logo": "https://mobilesx.in/mobilex-favicon.svg"
      }
    </script>

    <!-- Website Schema -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "MobileX",
        "url": "https://mobilesx.in/",
        "inLanguage": "en-IN"
      }
    </script>
  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
